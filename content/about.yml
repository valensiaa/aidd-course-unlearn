  - icon: i-lucide-calendar-heart
    title: Built around your life
    description: Book a time that works, reschedule for free up to 12 hours before, and learn from anywhere with a laptop or phone.
  - icon: i-lucide-wallet
    title: No subscriptions
    description: Teachers set clear prices on their profiles. You only pay for the lessons you book — no hidden fees.
