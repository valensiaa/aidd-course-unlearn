<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <radialGradient id="fill" cx="10%" cy="15%" r="95%">
      <stop offset="0" stop-color="#C22C1A" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#86291D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#49110A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FA8468"/>
      <stop offset="0.6" stop-color="#F6512F" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#F6512F" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- outer haze -->
  <path filter="url(#haze)" fill="#F6512F" fill-opacity="0.35" d="M0 30C120 10 230 70 290 190c30 60 40 130 50 210H0V30Z"/>
  <!-- body -->
  <path filter="url(#soft)" fill="url(#fill)" d="M0 30C120 10 230 70 290 190c30 60 40 130 50 210H0V30Z"/>
  <!-- glowing rim -->
  <path filter="url(#glow)" stroke="url(#rim)" stroke-width="3" stroke-linecap="round" d="M0 30C120 10 230 70 290 190c30 60 40 130 50 210"/>
</svg>
